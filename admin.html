<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 24px;
        }

        .admin-card {
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .admin-card .admin-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: var(--text-muted);
        }

        .admin-card h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .admin-card p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .admin-card .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .admin-card .form-group label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .admin-card .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.875rem;
            font-family: inherit;
            background: var(--bg);
            color: var(--text);
            transition: border-color var(--transition);
        }

        .admin-card .form-group input:focus {
            outline: none;
            border-color: var(--text);
        }

        .admin-card .btn {
            width: 100%;
            justify-content: center;
        }

        .admin-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            font-size: 0.8125rem;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .admin-error.show {
            display: block;
        }

        .admin-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8125rem;
            margin-top: 24px;
            transition: color var(--transition);
        }

        .admin-back:hover {
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="admin-page">
        <div class="admin-card">
            <div class="admin-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h1>Admin Panel</h1>
            <p>İdarəetmə panelinə daxil olmaq üçün şifrəni daxil edin</p>
            <div class="admin-error" id="adminError">Yanlış şifrə</div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label>Şifrə</label>
                    <input type="password" id="adminPassword" placeholder="Şifrəni daxil edin" required>
                </div>
                <button type="submit" class="btn btn-primary">Daxil ol</button>
            </form>
            <a href="index.html" class="admin-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                Portfolio-ya qayıt
            </a>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value;
            if (pass === 'adminadmin123123') {
                sessionStorage.setItem('admin', 'true');
                window.location.href = 'index.html?admin=true';
            } else {
                document.getElementById('adminError').classList.add('show');
                document.getElementById('adminPassword').value = '';
                document.getElementById('adminPassword').focus();
            }
        });

        if (sessionStorage.getItem('admin') === 'true') {
            window.location.href = 'index.html?admin=true';
        }
    </script>
</body>
</html>
